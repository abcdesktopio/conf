apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyos-od
  labels:
    abcdesktop/role: pyos
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pyos-od
  template:
    metadata:
      labels:
        name: pyos-od
        run: pyos-od
        netpol/https: 'true'
        netpol/ldaps: 'true'
        netpol/auth: 'true'
        netpol/cifs: 'true'
        netpol/api: 'true'
        netpol/dns: 'true'
        netpol/mongodb: 'true'
        netpol/memcached: 'true'
        netpol/graylog: 'true'
        netpol/router: 'true'
        netpol/nginx: 'true'
    spec:
      serviceAccountName: pyos-serviceaccount
      dnsPolicy: ClusterFirst
      containers:
      - name : pyos
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/pyos:4.4.1.alpine_latest
        volumeMounts:
          - name: jwtsigningkeys
            mountPath: "/config.signing"
            readOnly: true
          - name: jwtusersigningkeys
            mountPath: "/config.usersigning"
            readOnly: true
          - name: jwtpayloadkeys
            mountPath: "/config.payload"
            readOnly: true
          - name: volume-abcdesktop-config
            mountPath: /var/pyos/od.config
            subPath: od.config
            readOnly: true
          - name: volume-abcdesktop-passwd-templatefile
            mountPath: /var/pyos/passwd
            subPath: passwd
            readOnly: true
          - name: volume-abcdesktop-group-templatefile
            mountPath: /var/pyos/group
            subPath: group
            readOnly: true
          - name: volume-abcdesktop-shadow-templatefile
            mountPath: /var/pyos/shadow
            subPath: shadow
            readOnly: true
          - name: volume-abcdesktop-gshadow-templatefile
            mountPath: /var/pyos/gshadow
            subPath: gshadow
            readOnly: true
        ports:
          - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /API/healthz
            port: 8000
          failureThreshold: 1
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /API/healthz
            port: 8000
          failureThreshold: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 1
            memory: 2048Mi
          requests:
            cpu: 0.1
            memory: 256Mi
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: MONGODB_URL
            valueFrom:
              secretKeyRef:
                name: secret-mongodb
                key: MONGODB_URL
          - name: OAUTHLIB_RELAX_TOKEN_SCOPE
            value: "1"
      volumes:
        - name: jwtusersigningkeys
          secret:
            secretName: abcdesktopjwtusersigning
        - name: jwtsigningkeys
          secret:
            secretName: abcdesktopjwtdesktopsigning
        - name: jwtpayloadkeys
          secret:
            secretName: abcdesktopjwtdesktoppayload
        - name: volume-abcdesktop-config
          configMap:
            name: abcdesktop-config
        - name: volume-abcdesktop-passwd-templatefile
          configMap:
            name: abcdesktop-passwd-templatefile
        - name: volume-abcdesktop-group-templatefile
          configMap:
            name: abcdesktop-group-templatefile
        - name: volume-abcdesktop-shadow-templatefile
          configMap:
            name: abcdesktop-shadow-templatefile
        - name: volume-abcdesktop-gshadow-templatefile
          configMap:
            name: abcdesktop-gshadow-templatefile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-od
  labels:
    abcdesktop/role: console
spec:
  selector:
    matchLabels:
      run: console-od
  replicas: 1
  template:
    metadata:
      labels:
        run: console-od
        type: admin-console
    spec:
      automountServiceAccountToken: false
      containers:
      - name: console
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/console:4.4
        securityContext:
          readOnlyRootFilesystem: true
        ports:
          - containerPort: 80
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        resources:
          limits:
            cpu: 0.5
            memory: 128Mi
          requests:
            cpu: 0.1
            memory: 16Mi
        volumeMounts:
          - name: version-config-volume
            mountPath: /usr/share/nginx/html/config/versionConfig.json
            subPath: versionConfig.json
            readOnly: true
          # read-write volumes for nginx
          - name: var-log-volume
            mountPath: /var/log/nginx
            readOnly: false
          - name: var-cache-volume
            mountPath: /var/cache/nginx
            readOnly: false
          - name: var-run-volume
            mountPath: /var/run
            readOnly: false
      volumes:
        # read-write volumes for nginx
        - name: var-log-volume
          emptyDir: {}
        - name: var-cache-volume
          emptyDir: {}
        - name: var-run-volume
          emptyDir: {}
        - name: version-config-volume
          configMap:
            name: version-config
---
