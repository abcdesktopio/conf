---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pyos-role
rules:
- apiGroups: ['']
  resources: ['pods']
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ['']
  resources: ['events']
  verbs: [ "get", "list", "watch" ]
- apiGroups: ['']
  resources: ['pods/exec']
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ['']
  resources: ['pods/ephemeralcontainers']
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ['']
  resources: ['secrets']
  verbs:  ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ['']
  resources: ['configmaps']
  verbs:  ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ['']
  resources: ['pods/log']
  verbs: ['get', 'list', 'watch' ]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "create", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pyos-rbac
subjects:
- kind: ServiceAccount
  name: pyos-serviceaccount
roleRef:
  kind: Role
  name: pyos-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyos-serviceaccount
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: version-config
data:
  versionConfig.json: |-
    {
      "ABCDESKTOP_VERSION": "4.4",
      "ABCDESKTOP_APPLICATIONS_LIST_URL": "https://raw.githubusercontent.com/abcdesktopio/images/refs/heads/main/appLists/appList.4.4.json"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-mongodb-scripts
  labels:
    abcdesktop/role: mongodb-config
data:
  ensure-users.js: |
    const targetDbList = cat('/etc/abcdesktop/MONGO_DBS_LIST');
    const rootUser = cat('/etc/abcdesktop/admin/MONGO_ROOT_USERNAME');
    const rootPass = cat('/etc/abcdesktop/admin/MONGO_ROOT_PASSWORD');
    const usersStr = cat('/etc/abcdesktop/MONGO_USERS_LIST');

    // auth against admin
    const adminDb = db.getSiblingDB('admin');
    adminDb.auth(rootUser, rootPass);
    print('Successfully authenticated admin user');

    print( 'List of database' );
    print(targetDbList );
    const targetDbs=targetDbList.split(',');

    for (targetDbStr of targetDbs) {
      print ( 'use ' + targetDbStr );
      // we'll create the users here
      const targetDb = db.getSiblingDB(targetDbStr);
      // user-defined roles should be stored in the admin db
      const customRoles = adminDb
        .getRoles({rolesInfo: 1, showBuiltinRoles: false})
        .map(role => role.role)
        .filter(Boolean);

      // parse the list of users, and create each user as needed
      usersStr
        .trim()
        .split(';')
        .map(s => s.split(':'))
        .forEach(user => {
          const username = user[0];
          const rolesStr = user[1];
          const password = user[2];

          if (!rolesStr || !password) {
            return;
          }

          const roles = rolesStr.split(',');
          const userDoc = {
            user: username,
            pwd: password,
          };

          userDoc.roles = roles.map(role => {
            if (!~customRoles.indexOf(role)) {
              // is this a user defined role?
              return role; // no, it is built-in, just use the role name
            }
            return {role: role, db: 'admin'}; // yes, user-defined, specify the long format
          });

          try {
            targetDb.createUser(userDoc);
          } catch (err) {
            print( err );
            if (!~err.message.toLowerCase().indexOf('duplicate')) {
              // if not a duplicate user
              throw err; // rethrow
            }
          }
        }
      );
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-mongodb
  labels:
    abcdesktop/role: mongodb
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: 'root'
  MONGO_ROOT_PASSWORD: 'Oge5iQw9dGBvRDd'
  MONGO_USERNAME: 'pyos'
  MONGO_PASSWORD: 'Az4MeYWUjZDg4Zjhk'
  MONGO_USERS_LIST: 'pyos:readWrite:Az4MeYWUjZDg4Zjhk'
  MONGO_DBS_LIST: 'image,fail2ban,loginHistory,applications,profiles,desktop'
  MONGODB_URL: 'mongodb://pyos:Az4MeYWUjZDg4Zjhk@mongodb'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: abcdesktop-passwd-templatefile
data:
  passwd: |
    {{ uid }}:x:{{ uidNumber }}:{{ gidNumber }}:{{ gecos }}:{{ homeDirectory }}:{{ loginShell }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: abcdesktop-group-templatefile
data:
  group: |
    sudo:x:27:{{ uid }}
    lpadmin:x:101:root,{{ uid }}
    {{ gid }}:x:{{ gidNumber }}:{{ uid }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: abcdesktop-shadow-templatefile
data:
  shadow: |
    {{ uid }}:{{ sha512 }}:19080:0:99999:7:::
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: abcdesktop-gshadow-templatefile
data:
  gshadow: |
    sudo:*::{{ uid }}
    lpadmin:!::root,{{ uid }}
    {{ gid }}:!::{{ uid }}              
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached-od 
  labels:
    abcdesktop/role: memcached
spec:
  selector:
    matchLabels:
      run: memcached-od
  replicas: 1
  template:
    metadata:
      labels:
        run: memcached-od
        type: database
    spec:
      automountServiceAccountToken: false
      containers:
      - name: memcached
        # like image: memcached:alpine 
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/oc.memcached:4.4
        resources:
          limits:
            cpu: 0.2
            memory: 64Mi
          requests:
            cpu: 0.1
            memory: 16Mi
        ports:
          - containerPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-od
  labels:
    run: mongodb-od
    type: database
    abcdesktop/role: mongodb
spec:
  selector:
    matchLabels:
      run: mongodb-od
  replicas: 1
  template:
    metadata:
      labels:
        run: mongodb-od
        type: database
    spec:
      containers:
      - name: mongodb
        image: ghcr.io/abcdesktopio/mongo:safemain
        resources:
          limits:
            cpu: 0.5
            memory: 512Mi
          requests:
            cpu: 0.1
            memory: 128Mi
        env:
        - name: MONGO_INITDB_ROOT_USERNAME_FILE
          value: /etc/abcdesktop/admin/MONGO_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD_FILE
          value: /etc/abcdesktop/admin/MONGO_ROOT_PASSWORD
        volumeMounts:
        - name: abcdesktop
          mountPath: /etc/abcdesktop
          readOnly: true
        - name: mongodb-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
         - name: abcdesktop
           secret:
             secretName: secret-mongodb
             items:
             - key: MONGO_ROOT_USERNAME
               path: admin/MONGO_ROOT_USERNAME
               mode: 0444
             - key: MONGO_ROOT_PASSWORD
               path: admin/MONGO_ROOT_PASSWORD
               mode: 0444
             - key: MONGO_USERNAME
               path: MONGO_USERNAME
               mode: 0444
             - key: MONGO_PASSWORD
               path: MONGO_PASSWORD
               mode: 0444
             - key: MONGO_USERS_LIST
               path: MONGO_USERS_LIST
               mode: 0444
             - key: MONGO_DBS_LIST
               path: MONGO_DBS_LIST
               mode: 0444
         - name: mongodb-scripts
           configMap:
             name: configmap-mongodb-scripts 
             items:
             - key: ensure-users.js
               path: ensure-users.js
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-od
  labels:
    abcdesktop/role: router
spec:
  replicas: 1
  selector:
    matchLabels:
      name: router-od
  template:
    metadata:
      labels:
        name: router-od
        run:  router-od
        type: router-od
        # list netpool to permit router to connect to
        netpol/speedtest: 'true'
        netpol/pyos: 'true'
        netpol/ocuser: 'true'
        netpol/dns: 'true'
        netpol/nginx: 'true'
        netpol/console: 'true'
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      containers:
      - name: nginx-router
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/route:4.4
        # securityContext:
        #  readOnlyRootFilesystem: true
        ports:
          - containerPort: 80
            name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          failureThreshold: 1
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          failureThreshold: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 0.5
            memory: 512Mi
          requests:
            cpu: 0.1
            memory: 16Mi
        env:
          #
          # overwrite default values for development
          # you should not change the default values
          #
          # - name: SPEEDTEST_FQDN
          #  value: speedtest.abcdesktop.svc.cluster.local
          # - name: PYOS_FQDN
          #  value: pyos.abcdesktop.svc.cluster.local
          # - name: CONSOLE_FQDN
          #  value: console.abcdesktop.svc.cluster.local
          # - name: WEBSITE_FQDN
          #  value: website.abcdesktop.svc.cluster.local
          - name: JWT_DESKTOP_PAYLOAD_PRIVATE_KEY
            value: "/config.payload/abcdesktop_jwt_desktop_payload_private_key.pem"
          - name: JWT_DESKTOP_SIGNING_PUBLIC_KEY
            value: "/config.signing/abcdesktop_jwt_desktop_signing_public_key.pem"
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        volumeMounts:
          # keys for JWT signing and payload
          - name: jwtsigningkeys
            mountPath: "/config.signing"
            readOnly: true
          - name: jwtpayloadkeys
            mountPath: "/config.payload"
            readOnly: true
          # non-persistent volumes for nginx
          # - name: etc-nginx-scgi-temp
          #  mountPath: /etc/nginx/scgi_temp
          #  readOnly: false
          #- name: etc-nginx-uwsgi-temp
          #  mountPath: /etc/nginx/uwsgi_temp
          #  readOnly: false
          #- name: etc-nginx-fastcgi-temp
          #  mountPath: /etc/nginx/fastcgi_temp
          #  readOnly: false
          #- name: usr-local-openresty-log
          #  mountPath: /usr/local/openresty/nginx/logs
          #  readOnly: false
          #- name: var-run-openresty
          #  mountPath: /var/run/openresty
          #  readOnly: false
          #- name: etc-nginx-client-body-temp
          #  mountPath: /etc/nginx/client_body_temp 
          #  readOnly: false
          #- name: etc-nginx-proxy-temp
          #  mountPath: /etc/nginx/proxy_temp
          #  readOnly: false
          #- name: var-log-nginx
          #  mountPath: /var/log/nginx
          #  readOnly: false
          #- name: tmp
          #  mountPath: /tmp
          #  readOnly: false
      volumes:
        - name: jwtsigningkeys
          secret:
            secretName: abcdesktopjwtdesktopsigning
        - name: jwtpayloadkeys
          secret:
            secretName: abcdesktopjwtdesktoppayload
        #- name: etc-nginx-scgi-temp
        #emptyDir: {}
        #- name: etc-nginx-uwsgi-temp
        #emptyDir: {}
        #- name: etc-nginx-fastcgi-temp
        #emptyDir: {}
        #- name: usr-local-openresty-log
        #emptyDir: {}
        #- name: etc-nginx-client-body-temp
        #emptyDir: {}
        #- name: var-nginx-log
        #emptyDir: {}
        #- name: etc-nginx-proxy-temp
        #emptyDir: {}
        #- name: var-log-nginx
        #emptyDir: {}
        #- name: tmp
        #emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-od
  labels:
    abcdesktop/role: website
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nginx-od
  template:
    metadata:
      labels:
        name: nginx-od
        run: nginx-od
        type: frontend
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/oc.nginx:4.4.1
        securityContext:
          readOnlyRootFilesystem: true
        ports:
          - containerPort: 80
            name: http
        livenessProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 1
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 0.5
            memory: 128Mi
          requests:
            cpu: 0.1
            memory: 8Mi
        volumeMounts:
          # read-write volumes for nginx
          - name: var-log-volume
            mountPath: /var/log/nginx
            readOnly: false
          - name: var-cache-volume
            mountPath: /var/cache/nginx
            readOnly: false
          - name: var-run-volume
            mountPath: /var/run
            readOnly: false
      volumes:
        # read-write volumes for nginx
        - name: var-log-volume
          emptyDir: {}
        - name: var-cache-volume
          emptyDir: {}
        - name: var-run-volume
          emptyDir: {}
---
