  name: nginx-od
  labels:
    abcdesktop/role: website
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nginx-od
  template:
    metadata:
      labels:
        name: nginx-od
        run: nginx-od
        type: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: nginx
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/oc.nginx:4.5
        securityContext:
          allowPrivilegeEscalation: false
        ports:
          - containerPort: 8000
            name: http
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          failureThreshold: 1
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: 8000
          failureThreshold: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 0.5
            memory: 128Mi
          requests:
            cpu: 0.1
            memory: 8Mi
