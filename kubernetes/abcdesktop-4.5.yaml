apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-od
  labels:
    abcdesktop/role: router
spec:
  replicas: 1
  selector:
    matchLabels:
      name: router-od
  template:
    metadata:
      labels:
        name: router-od
        run:  router-od
        type: router-od
        # list netpool to permit router to connect to
        netpol/speedtest: 'true'
        netpol/pyos: 'true'
        netpol/ocuser: 'true'
        netpol/dns: 'true'
        netpol/nginx: 'true'
        netpol/console: 'true'
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: nginx-router
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/route:4.5
        securityContext:
          allowPrivilegeEscalation: false
        ports:
          - containerPort: 8000
            name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 1
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 0.5
            memory: 512Mi
          requests:
            cpu: 0.1
            memory: 16Mi
        env:
          #
          # overwrite default values for development
          # you should not change the default values
          #
          # - name: SPEEDTEST_FQDN
          #  value: speedtest.abcdesktop.svc.cluster.local
          # - name: PYOS_FQDN
          #  value: pyos.abcdesktop.svc.cluster.local
          # - name: CONSOLE_FQDN
          #  value: console.abcdesktop.svc.cluster.local
          # - name: WEBSITE_FQDN
          #  value: website.abcdesktop.svc.cluster.local
          - name: JWT_DESKTOP_PAYLOAD_PRIVATE_KEY
            value: "/config.payload/abcdesktop_jwt_desktop_payload_private_key.pem"
          - name: JWT_DESKTOP_SIGNING_PUBLIC_KEY
            value: "/config.signing/abcdesktop_jwt_desktop_signing_public_key.pem"
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        volumeMounts:
          # keys for JWT signing and payload
          - name: jwtsigningkeys
            mountPath: "/config.signing"
            readOnly: true
          - name: jwtpayloadkeys
            mountPath: "/config.payload"
            readOnly: true
          # non-persistent volumes for nginx
          # - name: etc-nginx-scgi-temp
          #  mountPath: /etc/nginx/scgi_temp
          #  readOnly: false
          #- name: etc-nginx-uwsgi-temp
          #  mountPath: /etc/nginx/uwsgi_temp
          #  readOnly: false
          #- name: etc-nginx-fastcgi-temp
          #  mountPath: /etc/nginx/fastcgi_temp
          #  readOnly: false
          #- name: usr-local-openresty-log
          #  mountPath: /usr/local/openresty/nginx/logs
          #  readOnly: false
          #- name: var-run-openresty
          #  mountPath: /var/run/openresty
          #  readOnly: false
          #- name: etc-nginx-client-body-temp
          #  mountPath: /etc/nginx/client_body_temp 
          #  readOnly: false
          #- name: etc-nginx-proxy-temp
          #  mountPath: /etc/nginx/proxy_temp
          #  readOnly: false
          #- name: var-log-nginx
          #  mountPath: /var/log/nginx
          #  readOnly: false
          #- name: tmp
          #  mountPath: /tmp
          #  readOnly: false
      volumes:
        - name: jwtsigningkeys
          secret:
            secretName: abcdesktopjwtdesktopsigning
        - name: jwtpayloadkeys
          secret:
            secretName: abcdesktopjwtdesktoppayload
        #- name: etc-nginx-scgi-temp
        #emptyDir: {}
        #- name: etc-nginx-uwsgi-temp
        #emptyDir: {}
        #- name: etc-nginx-fastcgi-temp
        #emptyDir: {}
        #- name: usr-local-openresty-log
        #emptyDir: {}
        #- name: etc-nginx-client-body-temp
        #emptyDir: {}
        #- name: var-nginx-log
        #emptyDir: {}
        #- name: etc-nginx-proxy-temp
        #emptyDir: {}
        #- name: var-log-nginx
        #emptyDir: {}
        #- name: tmp
        #emptyDir: {}
