apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyos-od
  labels:
    abcdesktop/role: pyos
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pyos-od
  template:
    metadata:
      labels:
        name: pyos-od
        run: pyos-od
        netpol/https: 'true'
        netpol/ldaps: 'true'
        netpol/auth: 'true'
        netpol/cifs: 'true'
        netpol/api: 'true'
        netpol/dns: 'true'
        netpol/mongodb: 'true'
        netpol/memcached: 'true'
        netpol/graylog: 'true'
        netpol/router: 'true'
        netpol/nginx: 'true'
    spec:
      serviceAccountName: pyos-serviceaccount
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroup: 2048
        runAsUser: 2048
        runAsGroup: 2048
        runAsNonRoot: true
      containers:
      - name : pyos
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/pyos:4.5.alpine_latest
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: jwtsigningkeys
            mountPath: "/config.signing"
            readOnly: true
          - name: jwtusersigningkeys
            mountPath: "/config.usersigning"
            readOnly: true
          - name: jwtpayloadkeys
            mountPath: "/config.payload"
            readOnly: true
          - name: volume-abcdesktop-config
            mountPath: /var/pyos/od.config
            subPath: od.config
            readOnly: true
          - name: volume-abcdesktop-passwd-templatefile
            mountPath: /var/pyos/passwd
            subPath: passwd
            readOnly: true
          - name: volume-abcdesktop-group-templatefile
            mountPath: /var/pyos/group
            subPath: group
            readOnly: true
          - name: volume-abcdesktop-shadow-templatefile
            mountPath: /var/pyos/shadow
            subPath: shadow
            readOnly: true
          - name: volume-abcdesktop-gshadow-templatefile
            mountPath: /var/pyos/gshadow
            subPath: gshadow
            readOnly: true
        ports:
          - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /API/healthz
            port: 8000
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /API/healthz
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 30
        resources:
          limits:
            cpu: 1
            memory: 2048Mi
          requests:
            cpu: 0.1
            memory: 256Mi
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: MONGODB_URL
            valueFrom:
              secretKeyRef:
                name: secret-mongodb
                key: MONGODB_URL
          - name: OAUTHLIB_RELAX_TOKEN_SCOPE
            value: "1"
      volumes:
        - name: jwtusersigningkeys
          secret:
            secretName: abcdesktopjwtusersigning
        - name: jwtsigningkeys
          secret:
            secretName: abcdesktopjwtdesktopsigning
        - name: jwtpayloadkeys
          secret:
            secretName: abcdesktopjwtdesktoppayload
        - name: volume-abcdesktop-config
          configMap:
            name: abcdesktop-config
        - name: volume-abcdesktop-passwd-templatefile
          configMap:
            name: abcdesktop-passwd-templatefile
        - name: volume-abcdesktop-group-templatefile
          configMap:
            name: abcdesktop-group-templatefile
        - name: volume-abcdesktop-shadow-templatefile
          configMap:
            name: abcdesktop-shadow-templatefile
        - name: volume-abcdesktop-gshadow-templatefile
          configMap:
            name: abcdesktop-gshadow-templatefile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-od
  labels:
    abcdesktop/role: console
spec:
  selector:
    matchLabels:
      run: console-od
  replicas: 1
  template:
    metadata:
      labels:
        run: console-od
        type: admin-console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: console
        imagePullPolicy: Always
        image: ghcr.io/abcdesktopio/console:4.5
        securityContext:
          allowPrivilegeEscalation: false
        ports:
          - containerPort: 8000
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        resources:
          limits:
            cpu: 0.5
            memory: 128Mi
          requests:
            cpu: 0.1
            memory: 16Mi
        volumeMounts:
          - name: version-config-volume
            mountPath: /usr/share/nginx/html/config/versionConfig.json
            subPath: versionConfig.json
            readOnly: true
      volumes:
        - name: version-config-volume
          configMap:
            name: abcdesktop-version-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap-od
  labels:
    abcdesktop/role: openldap
spec:
  selector:
    matchLabels:
      run: openldap-od
  replicas: 1
  template:
    metadata:
      labels:
        run: openldap-od
        netpol/dns: 'true'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: openldap
        # abcdesktopio/docker-test-openldap:master
        # is same as https://github.com/rroemhild/docker-test-openldap
        # but with posixAccount support
        image: ghcr.io/abcdesktopio/docker-test-openldap:4.5
        imagePullPolicy: Always
        resources:
          limits:
            cpu: 0.5
            memory: 2048Mi
          requests:
            cpu: 0.1
            memory: 128Mi
        ports:
          - containerPort: 389
          - containerPort: 636
