    {{ gid }}:!::{{ uid }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-od
  labels:
    run: mongodb-od
    type: database
    abcdesktop/role: mongodb
spec:
  serviceName: mongodb
  replicas: 1 # MONGO_REPLICAS
  selector:
    matchLabels:
      run: mongodb-od
  template:
    metadata:
      labels:
        run: mongodb-od
        type: database
        netpol/mongodb: 'true'
        netpol/dns: 'true'
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      # --- InitContainer to prepare configuration
      initContainers:
      - name: prepare-config
        image: ghcr.io/abcdesktopio/mongo:safe8.2
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        command:
          - sh
          - -c
          - /scripts/init-container.sh
        volumeMounts:
          - name: init-container-script
            mountPath: /scripts/init-container.sh
            subPath: init-container.sh
            readOnly: true
          - name: config
            mountPath: /input/mongod.conf
            subPath: mongod.conf
          - name: prepared-config
            mountPath: /work/config
          - name: logs
            mountPath: /var/log/mongodb

      # --- Main MongoDB container
      containers:
      - name: mongodb
        image: ghcr.io/abcdesktopio/mongo:safe8.2
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        # DO NOT use `command`, keep docker-entrypoint.sh
        args: ["--config=/etc/mongodb/mongod.conf"]
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
          - name: prepared-config
            mountPath: /etc/mongodb
          - name: abcdesktop
            mountPath: /etc/abcdesktop
            readOnly: true
          - name: init-script
            mountPath: /docker-entrypoint-initdb.d/init.js
            subPath: init.js
            readOnly: true
          - name: logs
            mountPath: /var/log/mongodb
          - name: data
            mountPath: /data/db
        env:
          - name: MONGO_INITDB_ROOT_USERNAME_FILE
            value: /etc/abcdesktop/admin/MONGO_ROOT_USERNAME
          - name: MONGO_INITDB_ROOT_PASSWORD_FILE
            value: /etc/abcdesktop/admin/MONGO_ROOT_PASSWORD
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1          
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 128Mi

      # --- Non-persistent volumes
      volumes:
        - name: init-container-script
          configMap:
            name: configmap-mongodb-scripts
            items:
              - key: init-container.sh
                path: init-container.sh
            defaultMode: 0755
        - name: config
          configMap:
            name: configmap-mongodb-scripts
            items:
              - key: mongod.conf
                path: mongod.conf
        - name: abcdesktop
          secret:
            secretName: secret-mongodb
            items:
            - key: MONGO_ROOT_USERNAME
              path: admin/MONGO_ROOT_USERNAME
              mode: 0400
            - key: MONGO_ROOT_PASSWORD
              path: admin/MONGO_ROOT_PASSWORD
              mode: 0400
            - key: MONGO_USERNAME
              path: MONGO_USERNAME
              mode: 0400
            - key: MONGO_PASSWORD
              path: MONGO_PASSWORD
              mode: 0400
            - key: MONGO_USERS_LIST
              path: MONGO_USERS_LIST
              mode: 0400
            - key: MONGO_DBS_LIST
              path: MONGO_DBS_LIST
              mode: 0400
        - name: init-script
          configMap:
            name: configmap-mongodb-scripts
            items:
              - key: init.js
                path: init.js
        - name: prepared-config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        # --- Non-persistent volume for MongoDB data
        - name: data
          emptyDir: {}
---
